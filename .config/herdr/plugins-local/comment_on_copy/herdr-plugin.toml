id = "comment_on_copy"
name = "Comment on Copy"
version = "0.1.0"
min_herdr_version = "0.9.0"
description = "Comment on copied terminal text and send it to an agent."
platforms = ["macos"]

[[actions]]
id = "toggle"
title = "Toggle comment on copy"
description = "While on, copying opens a comment window."
contexts = ["global"]
command = ["python3", "toggle.py"]

[[panes]]
id = "note"
title = "comment on copy"
placement = "popup"
width = 88
height = 20
command = ["python3", "note.py"]
